<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>مولد أكواد التحقق</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
    <style>
        .generator-page {
            max-width: 700px;
            margin: 3rem auto;
            padding: 0 1.5rem;
        }
        .generator-card {
            background: white;
            padding: 2.5rem;
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
        }
        .generator-card h2 {
            color: #1a8d4c;
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
        }
        .generator-card .sub {
            color: #6b7280;
            margin-bottom: 2rem;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #1f2937;
        }
        .form-group input {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            font-size: 1rem;
            transition: 0.3s;
            font-family: 'Cairo', sans-serif;
        }
        .form-group input:focus {
            border-color: #1a8d4c;
            outline: none;
            box-shadow: 0 0 0 4px rgba(26, 141, 76, 0.1);
        }
        .btn-generate {
            background: #1a8d4c;
            color: white;
            border: none;
            padding: 0.9rem 2rem;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            width: 100%;
            font-family: 'Cairo', sans-serif;
        }
        .btn-generate:hover {
            background: #0d6e3a;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(26, 141, 76, 0.3);
        }
        .result-box {
            margin-top: 2rem;
            padding: 1.5rem;
            background: #f8fafc;
            border-radius: 16px;
            display: none;
            border: 2px solid #e5e7eb;
        }
        .result-box.show {
            display: block;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .result-box .label {
            font-weight: 600;
            color: #1f2937;
        }
        .result-box .code-block {
            background: #1e293b;
            color: #a5f3fc;
            padding: 1.2rem;
            border-radius: 12px;
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
            overflow-x: auto;
            margin: 0.8rem 0;
            white-space: pre-wrap;
            word-break: break-all;
            direction: ltr;
            text-align: left;
        }
        .btn-copy {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 0.5rem 1.5rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.3s;
            font-family: 'Cairo', sans-serif;
        }
        .btn-copy:hover {
            background: #2563eb;
        }
        .back-link {
            display: inline-block;
            margin-top: 1.5rem;
            color: #1a8d4c;
            text-decoration: none;
            font-weight: 600;
        }
        .back-link:hover {
            text-decoration: underline;
        }
        .info-note {
            margin-top: 1rem;
            padding: 1rem;
            background: #fef3c7;
            border-radius: 12px;
            border-right: 4px solid #f59e0b;
            font-size: 0.9rem;
            color: #92400e;
        }
        @media (max-width: 600px) {
            .generator-page { margin: 1.5rem auto; }
            .generator-card { padding: 1.5rem; }
        }
    </style>
</head>
<body>
    <div class="generator-page">
        <div class="generator-card">
            <h2>🔐 مولد أكواد التحقق</h2>
            <p class="sub">أدخل معلومات الوثيقة الجديدة لإنشاء كود تحقق عشوائي</p>

            <div class="form-group">
                <label for="docId">📄 رقم الوثيقة</label>
                <input type="text" id="docId" placeholder="مثال: 2026-001256" />
            </div>

            <div class="form-group">
                <label for="docDate">📅 تاريخ الإصدار</label>
                <input type="text" id="docDate" placeholder="مثال: 20 July 2026" />
            </div>

            <button class="btn-generate" onclick="generateCode()">⚡ إنشاء كود التحقق</button>

            <div class="result-box" id="resultBox">
                <p class="label">📋 الكود الجديد - انسخ وألصق في data.json:</p>
                <div class="code-block" id="codeBlock"></div>
                <button class="btn-copy" onclick="copyCode()">📋 نسخ</button>
                <br />
                <a href="#" class="back-link" onclick="resetForm(); return false;">+ إضافة وثيقة أخرى</a>
                <div class="info-note">
                    💡 بعد النسخ، ألصق الكود في ملف <strong>data.json</strong> ثم ارفع الملف إلى GitHub.
                </div>
            </div>
        </div>
    </div>

    <script>
        function generateRandomCode(length = 16) {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let result = '';
            for (let i = 0; i < length; i++) {
                result += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return result;
        }

        function generateCode() {
            const docId = document.getElementById('docId').value.trim();
            const docDate = document.getElementById('docDate').value.trim();

            if (!docId || !docDate) {
                alert('⚠️ يرجى إدخال رقم الوثيقة وتاريخ الإصدار');
                return;
            }

            const code = generateRandomCode(16);
            const jsonEntry = `  {\n    "code": "${code}",\n    "id": "${docId}",\n    "date": "${docDate}"\n  }`;

            const resultBox = document.getElementById('resultBox');
            const codeBlock = document.getElementById('codeBlock');

            codeBlock.textContent = jsonEntry;
            resultBox.classList.add('show');
            resultBox.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        function copyCode() {
            const codeBlock = document.getElementById('codeBlock');
            const text = codeBlock.textContent;

            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => {
                    const btn = document.querySelector('.btn-copy');
                    const originalText = btn.textContent;
                    btn.textContent = '✅ تم النسخ!';
                    btn.style.background = '#22c55e';
                    setTimeout(() => {
                        btn.textContent = originalText;
                        btn.style.background = '#3b82f6';
                    }, 2000);
                }).catch(() => {
                    fallbackCopy(text);
                });
            } else {
                fallbackCopy(text);
            }
        }

        function fallbackCopy(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                alert('✅ تم نسخ الكود!');
            } catch (e) {
                alert('❌ حدث خطأ، يرجى نسخ الكود يدويًا');
            }
            document.body.removeChild(textarea);
        }

        function resetForm() {
            document.getElementById('docId').value = '';
            document.getElementById('docDate').value = '';
            document.getElementById('resultBox').classList.remove('show');
            document.getElementById('docId').focus();
        }
    </script>
</body>
</html>
