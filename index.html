<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>التحقق من الوثيقة</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="container">
        <!-- القسم العلوي - أخضر -->
        <div class="header-green">
            <div class="verified-container">
                <div class="checkmark-circle">
                    <span class="checkmark">✓</span>
                </div>
                <h1 class="verified-title">VERIFIED</h1>
                <p class="verified-sub">تم التحقق من صحة الوثيقة</p>
            </div>
        </div>

        <!-- بطاقة المعلومات -->
        <div class="card">
            <div class="card-body">
                <div class="field-row">
                    <div class="field-label">
                        <span class="label-icon">📄</span>
                        رقم الوثيقة
                    </div>
                    <div class="field-value" id="docNumber">---</div>
                </div>
                
                <div class="field-row">
                    <div class="field-label">
                        <span class="label-icon">📅</span>
                        تاريخ الإصدار
                    </div>
                    <div class="field-value" id="issueDate">---</div>
                </div>

                <div class="status-row">
                    <span class="status-badge">✓ صالحة</span>
                </div>
            </div>
        </div>

        <div class="footer-green">
            <p>© 2026 نظام التحقق الإلكتروني</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
