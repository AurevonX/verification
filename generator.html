<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>مولد أكواد التحقق</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
    <style>
        .generator-page { max-width: 700px; margin: 3rem auto; padding: 0 1.5rem; }
        .generator-card { background: white; padding: 2.5rem; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.08); }
        .generator-card h2 { color: #198754; font-size: 1.8rem; margin-bottom: 0.5rem; }
        .generator-card p.sub { color: #6c757d; margin-bottom: 2rem; }
        .form-group { margin-bottom: 1.5rem; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 0.5rem; color: #212529; }
        .form-group input { width: 100%; padding: 0.8rem 1rem; border: 2px solid #e9ecef; border-radius: 12px; font-size: 1rem; transition: 0.3s; }
        .form-group input:focus { border-color: #198754; outline: none; box-shadow: 0 0 0 4px rgba(25,135,84,0.1); }
        .btn-generate { background: #198754; color: white; border: none; padding: 0.9rem 2rem; border-radius: 50px; font-size: 1.1rem; font-weight: 600; cursor: pointer; transition: 0.3s; width: 100%; }
        .btn-generate:hover { background: #157347; transform: translateY(-2px); box-shadow: 0 5px 20px rgba(25,135,84,0.3); }
        .result-box { margin-top: 2rem; padding: 1.5rem; background: #f8f9fa; border-radius: 12px; display: none; }
        .result-box.show { display: block; }
        .result-box .label { font-weight: 600; color: #495057; }
        .result-box .code-block { background: #1e1e2e; color: #cdd6f4; padding: 1.2rem; border-radius: 10px; font-family: 'Courier New', monospace; font-size: 0.9rem; overflow-x: auto; margin: 0.8rem 0; white-space: pre-wrap; word-break: break-all; }
        .btn-copy { background: #0d6efd; color: white; border: none; padding: 0.5rem 1.5rem; border-radius: 8px; cursor: pointer; font-weight: 600; transition: 0.3s; }
        .btn-copy:hover { background: #0b5ed7; }
        .back-link { display: inline-block; margin-top: 1.5rem; color: #198754; text-decoration: none; font-weight: 600; }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="generator-page">
        <div class="generator-card">
            <h2>🔐 مولد أكواد التحقق</h2>
            <p class="sub">أدخل معلومات الوثيقة الجديدة وسيتم إنشاء كود تحقق عشوائي طويل</p>
            <div class="form-group">
                <label for="docId">رقم الوثيقة</label>
                <input type="text" id="docId" placeholder="مثال: 2026-001256" />
            </div>
            <div class="form-group">
                <label for="docDate">تاريخ الإصدار</label>
                <input type="text" id="docDate" placeholder="مثال: 20 July 2026" />
            </div>
            <button class="btn-generate" onclick="generateCode()">إنشاء كود التحقق</button>
            <div class="result-box" id="resultBox">
                <p class="label">📋 الكود الجديد جاهز للنسخ:</p>
                <div class="code-block" id="codeBlock"></div>
                <button class="btn-copy" onclick="copyCode()">📋 نسخ</button>
                <br />
                <a href="#" class="back-link" onclick="resetForm(); return false;">+ إضافة وثيقة أخرى</a>
            </div>
        </div>
    </div>
    <script src="generator.js"></script>
</body>
</html>
